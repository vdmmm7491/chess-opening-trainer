<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Validate openings</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 16px; background: #302e2b; color: #fff; }
    h1 { font-size: 1.3rem; }
    .ok { color: #81b64c; } .err { color: #fa412d; } .warn { color: #f7c045; }
    li { margin: 4px 0; line-height: 1.4; }
    code { background: #262421; padding: 1px 5px; border-radius: 4px; }
    a { color: #8fc45a; }
  </style>
</head>
<body>
  <h1>Opening data check</h1>
  <p>Checks <code>js/openings.js</code>: every move is legal, ids are unique, levels are valid, and lines end on your move.
    Open this page after adding or editing openings. <a href="../index.html">← Back to the app</a></p>
  <div id="out">Checking…</div>
  <script type="module">
    import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm';
    import { OPENINGS, LEVELS } from '../js/openings.js';
    import { NOTES } from '../js/notes.js';
    import { LINE_NOTES } from '../js/line-notes.js';
    import { LINE_NOTES_BLACK } from '../js/line-notes-black.js';
    import { LINE_NOTES_D4 } from '../js/line-notes-d4.js';
    import { THEORY } from '../js/coach.js';

    const errors = [], warnings = [];
    const ids = new Set();
    let lineCount = 0;
    for (const o of OPENINGS) {
      const where = `<b>${o.name || o.id}</b>`;
      if (!o.id) errors.push(`${where}: missing <code>id</code>`);
      if (ids.has(o.id)) errors.push(`${where}: duplicate id <code>${o.id}</code>`);
      ids.add(o.id);
      if (o.side !== 'w' && o.side !== 'b') errors.push(`${where}: <code>side</code> must be 'w' or 'b'`);
      if (!Array.isArray(o.levels) || !o.levels.length) errors.push(`${where}: add <code>levels</code>, e.g. ['beginner', 'intermediate']`);
      else for (const l of o.levels) if (!LEVELS[l]) errors.push(`${where}: unknown level <code>${l}</code> (use ${Object.keys(LEVELS).join(', ')})`);
      if (!o.levelNote) warnings.push(`${where}: no <code>levelNote</code> explaining who it suits`);
      if (!o.lines?.length) { errors.push(`${where}: has no lines`); continue; }
      const seen = new Set();
      o.lines.forEach((line, i) => {
        lineCount++;
        const lw = `${where} line ${i + 1} (${line.name})`;
        const moves = line.moves.trim().split(/\s+/);
        if (seen.has(line.moves.trim())) warnings.push(`${lw}: duplicate of another line`);
        seen.add(line.moves.trim());
        const c = new Chess();
        for (let k = 0; k < moves.length; k++) {
          try { c.move(moves[k]); }
          catch { errors.push(`${lw}: illegal move <code>${moves[k]}</code> at move ${Math.floor(k / 2) + 1}${k % 2 ? '...' : '.'}`); return; }
        }
        const endsOnUser = (moves.length % 2 === 1) === (o.side === 'w');
        if (!endsOnUser) warnings.push(`${lw}: ends on the opponent's move. Add your reply at the end.`);
      });
    }
    // Coach notes: keys must be legal move sequences, ideally reached by some line.
    const allLines = OPENINGS.flatMap((o) => o.lines.map((l) => l.moves.trim().split(/\s+/).join(' ')));
    let noteCount = 0;
    for (const key of Object.keys(NOTES)) {
      noteCount++;
      const c = new Chess();
      let ok = true;
      for (const s of key.split(' ')) { try { c.move(s); } catch { errors.push(`Coach note <code>${key}</code>: illegal move <code>${s}</code>`); ok = false; break; } }
      if (ok && !allLines.some((l) => l === key || l.startsWith(key + ' '))) warnings.push(`Coach note <code>${key}</code> isn't reached by any line`);
    }

    // Per-line theory notes: each entry's move must match the line, and every position needs a note.
    const ALL_LINE_NOTES = { ...LINE_NOTES, ...LINE_NOTES_D4, ...LINE_NOTES_BLACK };
    for (const [id, lines] of Object.entries(ALL_LINE_NOTES)) {
      const o = OPENINGS.find((x) => x.id === id);
      if (!o) { errors.push(`Line notes for unknown opening <code>${id}</code>`); continue; }
      lines.forEach((entries, li) => {
        const line = o.lines[li];
        if (!line) { errors.push(`<b>${o.name}</b>: notes for line ${li + 1}, which doesn't exist`); return; }
        const mv = line.moves.trim().split(/\s+/);
        if (entries.length > mv.length) errors.push(`<b>${o.name}</b> line ${li + 1}: more notes (${entries.length}) than moves (${mv.length})`);
        entries.forEach((e, i) => {
          const san = e.split('|')[0];
          if (mv[i] !== san) errors.push(`<b>${o.name}</b> line ${li + 1}, note ${i + 1}: says <code>${san}</code> but the move is <code>${mv[i]}</code>`);
        });
      });
    }
    let missingNotes = 0;
    for (const o of OPENINGS) o.lines.forEach((l, li) => {
      const mv = l.moves.trim().split(/\s+/);
      for (let i = 1; i <= mv.length; i++) {
        const key = mv.slice(0, i).join(' ');
        if (!THEORY[key]) { missingNotes++; if (missingNotes <= 40) warnings.push(`<b>${o.name}</b> line ${li + 1}: no coach note for move ${Math.ceil(i / 2)}${i % 2 ? '.' : '...'}${mv[i - 1]}`); }
      }
    });
    if (missingNotes > 40) warnings.push(`…and ${missingNotes - 40} more moves without a coach note`);

    const list = (arr, cls) => arr.length ? `<ul>${arr.map((x) => `<li class="${cls}">${x}</li>`).join('')}</ul>` : '';
    document.getElementById('out').innerHTML =
      `<p>${OPENINGS.length} openings, ${lineCount} lines, ${noteCount} coach notes.</p>` +
      (errors.length ? `<h2 class="err">❌ ${errors.length} error(s)</h2>${list(errors, 'err')}` : '<h2 class="ok">✅ No errors</h2>') +
      (warnings.length ? `<h2 class="warn">⚠ ${warnings.length} warning(s)</h2>${list(warnings, 'warn')}` : '');
  </script>
</body>
</html>
