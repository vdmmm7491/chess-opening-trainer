<html lang="en">
<head>

  <title>Opening Trainer – free chess opening practice</title>
  <meta name="description" content="Free chess opening trainer with Stockfish evaluation, progress tracking and a review of your online games." />

  <link rel="manifest" href="manifest.webmanifest" />
